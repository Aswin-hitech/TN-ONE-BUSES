
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Sign in — THE TN ONE</title>

<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/responsive.css" />
<link rel="icon" href="favicon.ico" type="image/x-icon" />

</head>


<body>

<script src="js/theme.js"></script>


<div class="auth-page">


  <!-- BRAND -->

  <div class="auth-brand">

    <div class="auth-logo">
      TN
    </div>

    <div class="auth-brand-name">
      THE TN ONE
    </div>

    <div class="auth-brand-sub">
      Community-Powered Bus Network
    </div>

  </div>


  <!-- LOGIN CARD -->

  <div class="auth-card">

    <h1>
      Welcome to THE TN ONE
    </h1>

    <p class="auth-description">
      Find buses, discover routes and share
      useful bus information with your community.
    </p>


    <!-- GOOGLE -->

    <button
      class="google-btn auth-google"
      id="google-signin-btn"
    >

      <span class="google-icon">
        G
      </span>

      Continue with Google

    </button>


    <!-- DIVIDER -->

    <div class="auth-divider">

      <span></span>

      <p>
        OR
      </p>

      <span></span>

    </div>


    <!-- USERNAME -->

    <div class="field">

      <label for="username">
        Username
      </label>

      <input
        id="username"
        type="text"
        placeholder="Enter your username"
        autocomplete="username"
      />

    </div>


    <!-- PASSWORD -->

    <div class="field">

      <label for="password">
        Password
      </label>

      <input
        id="password"
        type="password"
        placeholder="Enter your password"
        autocomplete="current-password"
      />

    </div>


    <!-- MESSAGE -->

    <div
      id="auth-message"
      class="alert"
      hidden
    ></div>


    <!-- LOGIN -->

    <button
      class="btn-primary auth-submit"
      id="password-btn"
    >
      Sign in
    </button>


    <!-- REGISTER -->

    <div class="register-text">

      Don't have an account?

      <button
        id="register-btn"
        class="register-link"
      >
        Create account
      </button>

    </div>

  </div>


  <!-- BACK -->

  <a
    href="index.html"
    class="auth-back"
  >
    ← Continue without signing in
  </a>


  <p class="auth-footer">
    Built for bus riders across Tamil Nadu.
  </p>


</div>


<script src="js/api.js"></script>
<script src="js/auth.js"></script>


<script>


/* GOOGLE LOGIN */

document
  .getElementById("google-signin-btn")
  .addEventListener(
    "click",
    function () {

      window.location.href =
        `${TNOne.API_BASE}/api/auth/login`;

    }
  );


/* AUTH */

async function submitAuth(path) {

  const username =
    document
      .getElementById("username")
      .value
      .trim();


  const password =
    document
      .getElementById("password")
      .value;


  const message =
    document.getElementById(
      "auth-message"
    );


  if (!username || !password) {

    message.hidden = false;

    message.className =
      "alert alert-error";

    message.textContent =
      "Please enter your username and password.";

    return;

  }


  message.hidden = true;


  try {

    await TNOne.post(
      path,
      {
        username: username,
        password: password
      }
    );


    window.location.href =
      "index.html";

  }

  catch (error) {

    message.hidden = false;

    message.className =
      "alert alert-error";

    message.textContent =
      error.message ||
      "Something went wrong.";

  }

}


/* SIGN IN */

document
  .getElementById("password-btn")
  .addEventListener(
    "click",
    function () {

      submitAuth(
        "/api/auth/password"
      );

    }
  );


/* REGISTER */

document
  .getElementById("register-btn")
  .addEventListener(
    "click",
    function () {

      submitAuth(
        "/api/auth/register"
      );

    }
  );


/* ENTER KEY */

document
  .getElementById("password")
  .addEventListener(
    "keydown",
    function (event) {

      if (event.key === "Enter") {

        submitAuth(
          "/api/auth/password"
        );

      }

    }
  );

</script>


</body>
</html>
