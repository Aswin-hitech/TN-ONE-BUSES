<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>THE TN ONE — Community-Powered Bus Network</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="icon" href="favicon.ico" type="image/x-icon" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
</head>

<body>
  <div class="map-screen">
    <!-- FULL VIEWPORT MAP -->
    <div id="map"></div>

    <!-- FLOATING BRAND & SEARCH CONTAINER -->
    <div class="map-floating-top">
      <div class="map-floating-header">
        <div class="brand-area">
          <div class="logo-placeholder">TN</div>
          <div class="brand-text-block">
            <span class="brand-title">THE TN ONE</span>
            <span class="brand-tagline">Community-Powered Bus Network</span>
          </div>
        </div>
        <div class="topbar-actions">
          <div id="topbar-auth"></div>
        </div>
      </div>

      <!-- SOURCE-DESTINATION BOX -->
      <div class="search-card">
        <div class="location-row">
          <div class="route-connector-line"></div>
          
          <div class="location-line">
            <span class="location-dot start"></span>
            <input id="origin-input" type="text" placeholder="From / Your location" autocomplete="off" />
          </div>

          <div class="location-divider"></div>

          <div class="location-line">
            <span class="location-dot destination"></span>
            <input id="destination-input" type="text" placeholder="Where to?" autocomplete="off" />
          </div>
        </div>

        <button id="search-route-btn" class="search-button">
          🔍 Search Buses
        </button>
      </div>
    </div>

    <!-- FLOATING ACTIONS OVER MAP -->
    <div class="map-floating-actions">
      <button id="locate-btn" class="fab-btn" title="Use my current location">
        <span>📍</span>
        <span>My Location</span>
      </button>

      <a href="report.html" class="fab-btn primary" title="Add a Bus">
        <span>＋</span>
        <span>Add Bus</span>
      </a>
    </div>

    <!-- BOTTOM BUS PANEL (Expandable / Collapsible Bottom Sheet) -->
    <div id="bus-bottom-panel" class="bottom-bus-panel">
      <!-- Handle for dragging/tapping -->
      <div class="bus-panel-handle-bar" id="bus-panel-handle">
        <div class="bus-panel-handle-pill"></div>
      </div>

      <!-- Panel Header (Tappable to toggle collapse/expand) -->
      <div class="bus-panel-header" id="bus-panel-header">
        <div class="bus-panel-header-main">
          <div class="bus-panel-route" id="panel-route-title">Select route to see buses</div>
          <div class="bus-panel-distance" id="panel-distance-badge">0.0 km</div>
        </div>
        <div class="bus-panel-toggle-indicator" id="panel-toggle-btn">
          <span class="toggle-icon">▲</span>
          <span class="toggle-text">View Buses</span>
        </div>
      </div>

      <!-- Panel Body (Scrollable bus results) -->
      <div class="bus-panel-body" id="bus-panel-body">
        <!-- Next Buses Section -->
        <div class="bus-panel-section-title">
          <span>NEXT BUSES</span>
          <span id="panel-bus-count" style="font-weight: normal; color: var(--color-text-muted);">0 found</span>
        </div>

        <!-- Bus List Container -->
        <div id="panel-bus-list" class="panel-bus-list">
          <div class="panel-empty-state">
            <div style="font-size: 28px; margin-bottom: 6px;">🗺️</div>
            <p>Select From and To locations above to find buses.</p>
          </div>
        </div>

        <!-- Add Bus CTA within panel -->
        <div class="panel-footer-action">
          <a id="panel-add-bus-btn" href="report.html" class="btn-primary" style="padding: 10px 16px; font-size: 14px;">
            ＋ Add Bus for this route
          </a>
        </div>
      </div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
      <a class="nav-item active" href="index.html">
        <span class="nav-icon">⌂</span>
        <span>Home</span>
      </a>
      <a class="nav-item" href="search.html">
        <span class="nav-icon">⌕</span>
        <span>Search</span>
      </a>
      <a class="nav-item" href="report.html">
        <span class="nav-icon">＋</span>
        <span>Add Bus</span>
      </a>
      <a class="nav-item" href="profile.html">
        <span class="nav-icon">👤</span>
        <span>Profile</span>
      </a>
    </nav>
  </div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      // 1. Initialize Auth
      const authContainer = document.getElementById("topbar-auth");
      const status = await TNAuth.getStatus();
      TNAuth.renderTopbarAuth(authContainer, status);

      // 2. Initialize Map (Center of Tamil Nadu)
      const map = L.map("map", {
        zoomControl: false
      }).setView([11.1271, 78.6569], 7);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        maxZoom: 19
      }).addTo(map);

      L.control.zoom({ position: "bottomleft" }).addTo(map);

      let userMarker = null;
      let routingControl = null;
      let fallbackRoute = null;
      let originMarker = null;
      let destMarker = null;

      const originInput = document.getElementById("origin-input");
      const destInput = document.getElementById("destination-input");
      const searchBtn = document.getElementById("search-route-btn");
      const locateBtn = document.getElementById("locate-btn");

      // Bottom Panel Elements
      const busPanel = document.getElementById("bus-bottom-panel");
      const busPanelHeader = document.getElementById("bus-panel-header");
      const busPanelHandle = document.getElementById("bus-panel-handle");
      const panelRouteTitle = document.getElementById("panel-route-title");
      const panelDistanceBadge = document.getElementById("panel-distance-badge");
      const panelToggleBtn = document.getElementById("panel-toggle-btn");
      const panelBusList = document.getElementById("panel-bus-list");
      const panelBusCount = document.getElementById("panel-bus-count");
      const panelAddBusBtn = document.getElementById("panel-add-bus-btn");

      // Panel Expand/Collapse Toggle
      let isPanelExpanded = false;
      function togglePanel(expand) {
        if (expand !== undefined) {
          isPanelExpanded = expand;
        } else {
          isPanelExpanded = !isPanelExpanded;
        }
        busPanel.classList.toggle("expanded", isPanelExpanded);
        const toggleIcon = panelToggleBtn.querySelector(".toggle-icon");
        const toggleText = panelToggleBtn.querySelector(".toggle-text");
        if (isPanelExpanded) {
          toggleIcon.textContent = "▼";
          toggleText.textContent = "Collapse";
        } else {
          toggleIcon.textContent = "▲";
          toggleText.textContent = "View Buses";
        }
      }

      busPanelHeader.addEventListener("click", () => togglePanel());
      busPanelHandle.addEventListener("click", () => togglePanel());

      // Stop Autocomplete
      setupAutocomplete(originInput, () => {
        if (destInput.value.trim()) triggerRouteFlow();
      });
      setupAutocomplete(destInput, () => {
        if (originInput.value.trim()) triggerRouteFlow();
      });

      searchBtn.addEventListener("click", () => {
        const from = originInput.value.trim();
        const to = destInput.value.trim();
        if (!from && !to) {
          alert("Please enter a starting point or destination.");
          originInput.focus();
          return;
        }
        if (from && to) {
          triggerRouteFlow();
        } else {
          window.location.href = `search.html?${from ? "from=" + encodeURIComponent(from) : ""}${to ? "&to=" + encodeURIComponent(to) : ""}`;
        }
      });

      // Main Orchestration Flow
      async function triggerRouteFlow() {
        const from = originInput.value.trim() || "Your location";
        const to = destInput.value.trim();
        if (!to) return;

        // Persist route
        sessionStorage.setItem("tn_one_from", from);
        sessionStorage.setItem("tn_one_to", to);

        // Update Panel Header
        panelRouteTitle.textContent = `${from} → ${to}`;
        panelDistanceBadge.textContent = "Calculating...";
        panelAddBusBtn.href = `report.html?from=${encodeURIComponent(from !== "Your location" ? from : "")}&to=${encodeURIComponent(to)}`;

        // Open Bottom Bus Panel (visible)
        busPanel.classList.add("visible");
        togglePanel(true); // Open expanded to show buses immediately

        // 1. Fetch Buses
        loadBusesForRoute(from, to);

        // 2. Geocode & Draw Route with distance
        calculateAndDrawRoute(from, to);
      }

      // API: Load Buses & Sort Timings
      async function loadBusesForRoute(from, to) {
        panelBusList.innerHTML = `
          <div class="panel-loading">
            <div class="loading-spinner"></div>
            <p style="font-size:13px; color:var(--color-text-secondary); margin-top:6px;">Finding buses for this route...</p>
          </div>`;
        panelBusCount.textContent = "Searching...";

        try {
          const res = await TNOne.get("/api/search", {
            from: from !== "Your location" ? from : "",
            to: to
          });
          const results = res.data && res.data.results ? res.data.results : [];
          renderPanelBuses(results, from, to);
        } catch (err) {
          panelBusList.innerHTML = `
            <div class="panel-empty-state">
              <div style="font-size:24px; margin-bottom:4px;">⚠️</div>
              <p style="color:var(--color-error);">Could not load buses. Please try again.</p>
            </div>`;
          panelBusCount.textContent = "0 found";
        }
      }

      function renderPanelBuses(results, from, to) {
        if (!results || results.length === 0) {
          panelBusCount.textContent = "0 found";
          panelBusList.innerHTML = `
            <div class="panel-empty-state">
              <div style="font-size:28px; margin-bottom:4px;">🚌</div>
              <p style="font-weight:700; color:var(--color-text);">No buses found for this route</p>
              <p style="font-size:12px; color:var(--color-text-secondary);">Be the first to add community timings!</p>
            </div>`;
          return;
        }

        panelBusCount.textContent = `${results.length} found`;

        // Extract timing items with chronological sort relative to now
        const now = new Date();
        const nowMins = now.getHours() * 60 + now.getMinutes();

        const cardsHtml = results.map((entry, idx) => {
          const bus = entry.bus || {};
          const busName = escapeHtml(bus.bus_name || "Bus");
          const busNum = bus.bus_number ? `<span class="panel-bus-num">${escapeHtml(bus.bus_number)}</span>` : "";
          const operator = escapeHtml(bus.operator || bus.bus_type || "");

          // Format next bus timing
          let timeDisplay = "";
          let countdownText = "";
          let isNearestUpcoming = idx === 0;

          if (entry.boarding_time) {
            const bt = new Date(entry.boarding_time);
            timeDisplay = bt.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
          } else if (bus.timings && bus.timings.length > 0) {
            timeDisplay = bus.timings[0];
          }

          if (entry.minutes_until_boarding !== null && entry.minutes_until_boarding !== undefined) {
            const mins = Math.round(entry.minutes_until_boarding);
            countdownText = mins > 0 ? `in ${mins} min` : "Departing now";
          }

          // Next bus highlight card for the nearest upcoming bus
          if (isNearestUpcoming) {
            return `
              <div class="panel-bus-item nearest-bus">
                <div class="nearest-bus-badge">🟢 NEXT BUS</div>
                <div class="panel-bus-row">
                  <div class="panel-bus-left">
                    <span class="panel-bus-title">🚌 ${busName}</span>
                    ${busNum}
                    ${operator ? `<div class="panel-bus-sub">${operator}</div>` : ""}
                  </div>
                  <div class="panel-bus-right">
                    <span class="panel-bus-time">${timeDisplay}</span>
                    ${countdownText ? `<span class="panel-bus-countdown">${countdownText}</span>` : ""}
                  </div>
                </div>
              </div>`;
          }

          // Subsequent buses
          return `
            <div class="panel-bus-item">
              <div class="panel-bus-row">
                <div class="panel-bus-left">
                  <span class="panel-bus-title">🚌 ${busName}</span>
                  ${busNum}
                  ${operator ? `<div class="panel-bus-sub">${operator}</div>` : ""}
                </div>
                <div class="panel-bus-right">
                  <span class="panel-bus-time">${timeDisplay}</span>
                  ${countdownText ? `<span class="panel-bus-countdown">${countdownText}</span>` : ""}
                </div>
              </div>
            </div>`;
        }).join("");

        panelBusList.innerHTML = cardsHtml;
      }

      // Geocoding & Route Calculation
      async function calculateAndDrawRoute(from, to) {
        if (routingControl) {
          try { map.removeControl(routingControl); } catch(_) {}
          routingControl = null;
        }
        if (fallbackRoute) {
          try { map.removeLayer(fallbackRoute); } catch(_) {}
          fallbackRoute = null;
        }
        if (originMarker) {
          try { map.removeLayer(originMarker); } catch(_) {}
          originMarker = null;
        }
        if (destMarker) {
          try { map.removeLayer(destMarker); } catch(_) {}
          destMarker = null;
        }

        const [p1, p2] = await Promise.all([
          geocodeLocation(from),
          geocodeLocation(to)
        ]);

        if (!p1 || !p2) {
          panelDistanceBadge.textContent = "Route found";
          return;
        }

        const latLng1 = L.latLng(p1[0], p1[1]);
        const latLng2 = L.latLng(p2[0], p2[1]);

        // Start & Destination Markers (Google Maps inspired)
        originMarker = L.circleMarker(latLng1, {
          radius: 8,
          fillColor: "#1a73e8",
          color: "#ffffff",
          weight: 3,
          fillOpacity: 1
        }).addTo(map).bindPopup(`<b>Start:</b> ${from}`);

        destMarker = L.circleMarker(latLng2, {
          radius: 8,
          fillColor: "#ea4335",
          color: "#ffffff",
          weight: 3,
          fillOpacity: 1
        }).addTo(map).bindPopup(`<b>Destination:</b> ${to}`);

        try {
          routingControl = L.Routing.control({
            waypoints: [latLng1, latLng2],
            routeWhileDragging: false,
            addWaypoints: false,
            show: false,
            createMarker: () => null, // We already create custom circle markers
            lineOptions: {
              styles: [
                { color: '#1a73e8', opacity: 0.9, weight: 6 }
              ]
            }
          })
          .on('routesfound', (e) => {
            const routes = e.routes;
            if (routes && routes.length > 0) {
              const summary = routes[0].summary;
              const distKm = (summary.totalDistance / 1000).toFixed(1);
              panelDistanceBadge.textContent = `${distKm} km`;
              
              // Fit map bounds with room for the bottom panel
              const bounds = L.latLngBounds([latLng1, latLng2]);
              map.fitBounds(bounds, { padding: [80, 80] });
            }
          })
          .on('routingerror', () => {
            drawFallbackPolyline(latLng1, latLng2, from, to);
          })
          .addTo(map);
        } catch (_) {
          drawFallbackPolyline(latLng1, latLng2, from, to);
        }
      }

      function drawFallbackPolyline(latLng1, latLng2, from, to) {
        if (routingControl) {
          try { map.removeControl(routingControl); } catch(_) {}
          routingControl = null;
        }
        fallbackRoute = L.polyline([latLng1, latLng2], {
          color: '#1a73e8',
          weight: 6,
          opacity: 0.85,
          dashArray: '8, 6'
        }).addTo(map);

        // Calculate direct distance in KM using Haversine formula
        const distM = map.distance(latLng1, latLng2);
        const distKm = (distM / 1000).toFixed(1);
        panelDistanceBadge.textContent = `${distKm} km`;

        map.fitBounds(fallbackRoute.getBounds(), { padding: [80, 80] });
      }

      async function geocodeLocation(name) {
        if (name === "Your location" && userMarker) {
          const ll = userMarker.getLatLng();
          return [ll.lat, ll.lng];
        }
        try {
          const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(name + ", Tamil Nadu, India")}&limit=1`;
          const res = await fetch(url, { headers: { "Accept-Language": "en" } });
          const data = await res.json();
          if (data && data.length) {
            return [parseFloat(data[0].lat), parseFloat(data[0].lon)];
          }
        } catch (_) {}
        return null;
      }

      // Geolocation Locate Button
      locateBtn.addEventListener("click", () => {
        if (!navigator.geolocation) {
          alert("Geolocation is not supported by your browser.");
          return;
        }
        locateBtn.style.opacity = "0.7";
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            locateBtn.style.opacity = "1";
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            map.setView([lat, lng], 14);

            if (userMarker) map.removeLayer(userMarker);
            userMarker = L.circleMarker([lat, lng], {
              radius: 8,
              fillColor: "#1a73e8",
              color: "#ffffff",
              weight: 3,
              fillOpacity: 1
            }).addTo(map).bindPopup("Your current location").openPopup();

            originInput.value = "Your location";
            if (destInput.value.trim()) triggerRouteFlow();
          },
          () => {
            locateBtn.style.opacity = "1";
            alert("Could not retrieve your location. Please check location permissions.");
          },
          { enableHighAccuracy: true, timeout: 8000 }
        );
      });

      // Stop Autocomplete
      function setupAutocomplete(inputEl, onSelect) {
        if (!inputEl) return;
        const wrap = document.createElement("div");
        wrap.className = "autocomplete-wrap";
        inputEl.parentNode.insertBefore(wrap, inputEl);
        wrap.appendChild(inputEl);

        const list = document.createElement("div");
        list.className = "autocomplete-list";
        wrap.appendChild(list);

        let debounceTimer = null;
        inputEl.addEventListener("input", () => {
          clearTimeout(debounceTimer);
          const q = inputEl.value.trim();
          if (q.length < 2) {
            list.classList.remove("active");
            list.innerHTML = "";
            return;
          }
          debounceTimer = setTimeout(async () => {
            try {
              const res = await TNOne.get("/api/stops/search", { q });
              const stops = res.data || [];
              if (!stops.length) {
                list.classList.remove("active");
                return;
              }
              list.innerHTML = stops
                .map((s) => `<div class="autocomplete-item" data-name="${escapeHtml(s.stop_name)}">${escapeHtml(s.stop_name)}</div>`)
                .join("");
              list.classList.add("active");
            } catch (_) {
              list.classList.remove("active");
            }
          }, 200);
        });

        list.addEventListener("click", (e) => {
          const item = e.target.closest(".autocomplete-item");
          if (!item) return;
          inputEl.value = item.dataset.name;
          list.classList.remove("active");
          if (onSelect) onSelect(item.dataset.name);
        });

        document.addEventListener("click", (e) => {
          if (!wrap.contains(e.target)) list.classList.remove("active");
        });
      }

      function escapeHtml(str) {
        if (!str) return "";
        return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }
    });
  </script>
</body>
</html>
