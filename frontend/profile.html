<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Your Profile — THE TN ONE</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
</head>

<body>
  <div class="app-shell">
    <!-- TOP BAR -->
    <header class="topbar">
      <div class="brand-area">
        <a href="index.html" class="logo-placeholder" title="Home">TN</a>
        <div class="brand-text-block">
          <a href="index.html" class="brand-title">THE TN ONE</a>
          <span class="brand-tagline">Community-Powered Bus Network</span>
        </div>
      </div>
      <div class="topbar-actions">
        <div id="topbar-auth"></div>
      </div>
    </header>

    <!-- PROFILE CARD -->
    <section class="profile-card">
      <div id="profile-avatar-container">
        <div class="profile-avatar-large">👤</div>
      </div>

      <h1 id="profile-name" class="profile-name">—</h1>
      <p id="profile-email" class="profile-email">—</p>

      <!-- USER STATS -->
      <div class="stats-grid">
        <div class="stat-box">
          <div id="report-count" class="stat-number">0</div>
          <div class="stat-label">Buses Added</div>
        </div>
        <div class="stat-box">
          <div id="photo-count" class="stat-number">0</div>
          <div class="stat-label">Photos</div>
        </div>
        <div class="stat-box">
          <div id="contrib-count" class="stat-number">0</div>
          <div class="stat-label">Reports</div>
        </div>
      </div>

      <button id="logout-btn" class="btn-secondary" style="width:100%; justify-content:center;">
        Sign out
      </button>
    </section>

    <!-- CONTRIBUTIONS HISTORY -->
    <main>
      <div class="results-header">
        <h2>Your Contributions</h2>
        <a href="report.html" class="btn-text">＋ Add Bus</a>
      </div>

      <div id="history-container">
        <div class="state-box">
          <div class="loading-spinner"></div>
          <p class="state-desc">Loading your contributions...</p>
        </div>
      </div>
    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
      <a class="nav-item" href="index.html">
        <span class="nav-icon">⌂</span>
        <span>Home</span>
      </a>
      <a class="nav-item" href="search.html">
        <span class="nav-icon">⌕</span>
        <span>Search</span>
      </a>
      <a class="nav-item" href="report.html">
        <span class="nav-icon">＋</span>
        <span>Add Bus</span>
      </a>
      <a class="nav-item active" href="profile.html">
        <span class="nav-icon">👤</span>
        <span>Profile</span>
      </a>
    </nav>
  </div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
