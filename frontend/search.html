<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Search Buses — THE TN ONE</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
</head>

<body>
  <div class="app-shell">
    <!-- TOP BAR -->
    <header class="topbar">
      <div class="brand-area">
        <a href="index.html" class="logo-placeholder" title="Home">TN</a>
        <div class="brand-text-block">
          <a href="index.html" class="brand-title">THE TN ONE</a>
          <span class="brand-tagline">Community-Powered Bus Network</span>
        </div>
      </div>
      <div class="topbar-actions">
        <div id="topbar-auth"></div>
      </div>
    </header>

    <!-- FLOATING SEARCH CARD -->
    <section class="search-card" style="margin-bottom: 16px;">
      <div class="location-row">
        <div class="route-connector-line"></div>
        
        <div class="location-line">
          <span class="location-dot start"></span>
          <input id="origin-input" type="text" placeholder="From / Boarding stop" autocomplete="off" />
        </div>

        <div class="location-divider"></div>

        <div class="location-line">
          <span class="location-dot destination"></span>
          <input id="destination-input" type="text" placeholder="Where to? (Destination)" autocomplete="off" />
        </div>
      </div>

      <button id="search-button" class="search-button">
        🔍 Search Buses
      </button>
    </section>

    <!-- SEARCH SUMMARY (Google Maps breadcrumb style) -->
    <div id="search-summary" style="display:none; align-items:center; justify-content:space-between; background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-md); padding:10px 14px; margin-bottom:16px; box-shadow:var(--shadow-sm);">
      <div style="font-weight:700; font-size:14px; color:var(--color-text);">
        📍 <span id="summary-route-text">Route</span>
      </div>
      <button id="edit-search" class="btn-text" style="padding:0;">Edit</button>
    </div>

    <!-- RESULTS SECTION -->
    <main>
      <div class="results-header">
        <h2>Available Buses</h2>
        <span id="result-count" class="count-pill">Ready to search</span>
      </div>

      <div id="results-container">
        <!-- Initial / Loaded states handled by search.js -->
        <div class="state-box">
          <div class="state-icon">🗺️</div>
          <p class="state-title">Where are you going?</p>
          <p class="state-desc">Enter your starting point and destination to find community-reported buses.</p>
        </div>
      </div>
    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
      <a class="nav-item" href="index.html">
        <span class="nav-icon">⌂</span>
        <span>Home</span>
      </a>
      <a class="nav-item active" href="search.html">
        <span class="nav-icon">⌕</span>
        <span>Search</span>
      </a>
      <a class="nav-item" href="report.html">
        <span class="nav-icon">＋</span>
        <span>Add Bus</span>
      </a>
      <a class="nav-item" href="profile.html">
        <span class="nav-icon">👤</span>
        <span>Profile</span>
      </a>
    </nav>
  </div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
