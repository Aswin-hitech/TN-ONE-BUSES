<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Find Buses — THE TN ONE</title>

<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>


<body>

<div class="app-shell search-page">


  <!-- TOP BAR -->

  <div class="topbar">

    <div class="brand-area">

      <div class="logo-placeholder">
        TN
      </div>

      <div>
        <div class="brand">
          THE TN ONE
        </div>

        <p class="brand-sub">
          Find your bus
        </p>
      </div>

    </div>

    <div id="topbar-auth"></div>

  </div>


  <!-- SEARCH -->

  <div class="search-header">

    <h1>
      Find a bus
    </h1>

    <div class="search-card">

      <div class="location-row">

        <div class="location-line">

          <span class="location-dot start"></span>

          <input
            id="origin-input"
            type="text"
            placeholder="From"
            autocomplete="off"
          />

        </div>


        <div class="route-line"></div>


        <div class="location-line">

          <span class="location-dot destination"></span>

          <input
            id="destination-input"
            type="text"
            placeholder="Where to?"
            autocomplete="off"
          />

        </div>

      </div>


      <button
        id="search-button"
        class="search-button"
      >
        🔍 Search Buses
      </button>

    </div>

  </div>


  <!-- SEARCH SUMMARY -->

  <div
    id="search-summary"
    class="search-summary"
    hidden
  >

    <div>

      <span id="summary-origin">
        From
      </span>

      <span class="arrow">
        →
      </span>

      <strong id="summary-destination">
        Destination
      </strong>

    </div>

    <button id="edit-search">
      Edit
    </button>

  </div>


  <!-- RESULTS -->

  <main class="results-section">

    <div class="results-heading">

      <div>
        <h2>
          Available buses
        </h2>

        <p id="result-count">
          Search to find buses
        </p>
      </div>

      <a
        href="report.html"
        class="add-bus-small"
      >
        ＋ Add Bus
      </a>

    </div>


    <div
      class="results"
      id="results-container"
    >

      <!-- Empty state -->

      <div class="empty-state">

        <div class="empty-icon">
          🚌
        </div>

        <h3>
          Find your next bus
        </h3>

        <p>
          Enter your starting point and destination to see buses reported by the community.
        </p>

      </div>

    </div>

  </main>


  <!-- BOTTOM NAV -->

  <nav class="bottom-nav">

    <a
      class="nav-item"
      href="index.html"
    >
      <span class="nav-icon">
        ⌂
      </span>

      <span>
        Home
      </span>
    </a>


    <a
      class="nav-item active"
      href="search.html"
    >
      <span class="nav-icon">
        ⌕
      </span>

      <span>
        Search
      </span>
    </a>


    <a
      class="nav-item"
      href="report.html"
    >
      <span class="nav-icon">
        ＋
      </span>

      <span>
        Add Bus
      </span>
    </a>


    <a
      class="nav-item"
      href="profile.html"
    >
      <span class="nav-icon">
        ○
      </span>

      <span>
        Profile
      </span>
    </a>

  </nav>

</div>


<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/search.js"></script>


<script>

const searchButton =
  document.getElementById("search-button");


searchButton.addEventListener(
  "click",
  function () {

    const origin =
      document
        .getElementById("origin-input")
        .value
        .trim();


    const destination =
      document
        .getElementById("destination-input")
        .value
        .trim();


    if (!origin || !destination) {

      alert(
        "Please enter both starting point and destination."
      );

      return;
    }


    document
      .getElementById("search-summary")
      .hidden = false;


    document
      .getElementById("summary-origin")
      .textContent = origin;


    document
      .getElementById("summary-destination")
      .textContent = destination;


    document
      .getElementById("result-count")
      .textContent =
      "Searching community reports...";

  });


document
  .getElementById("edit-search")
  .addEventListener(
    "click",
    function () {

      document
        .getElementById("search-summary")
        .hidden = true;

      document
        .getElementById("origin-input")
        .focus();

    }
  );

</script>

</body>
</html>
